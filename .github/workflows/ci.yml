name: CI

# Strategy (continuous publish from main, per ChrisonSimtian/ERP.Satisfactory#103):
#  • Every push / PR: build + test + pack.
#  • Push to main OR tag push matching v*: same flow, plus publish to GitHub
#    Packages. Each main commit gets a fresh height-derived version from
#    Nerdbank.GitVersioning, so versions march forward (4.0.5, 4.0.6, …) with
#    no SkipDuplicate gaps. Tags remain optional checkpoints / backfill triggers.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # required for the publish step on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          # Library projects target net8.0; the Nuke build host (build/_build.csproj)
          # targets net10.0 since Nuke.Common 10.x ships net10.0 only.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build, test, pack
        # Test + Pack are siblings on Compile, so invoking both runs the full
        # chain once: Restore → Compile → Test, then Compile → Pack (cached).
        env:
          # Restore needs to authenticate to nuget.pkg.github.com/ChrisonSimtian
          # for the Nuke.* packages (see nuget.config). The workflow-level
          # `packages: write` implicitly grants `read` for this token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh Test Pack --configuration Release

      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    # Continuous-from-main: every main commit publishes. Tag pushes still
    # publish (useful for backfilling from older commits). PR builds and
    # workflow_dispatch runs skip publish.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Push to GitHub Packages
        env:
          # NUGET_API_KEY publishes the produced *.nupkg files. GITHUB_TOKEN is
          # also needed at restore time (Nuke.* packages — see nuget.config).
          # Same token in both roles; `packages: write` covers both.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./build.sh Push \
            --configuration Release \
            --nuget-source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --nuget-api-key "$NUGET_API_KEY"
